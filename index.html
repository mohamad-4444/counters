<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <link rel="stylesheet" href="ibrahim.css">
</head>

<body>

    <div class="container">

        <h1>Counter App</h1>

        <div id="count">0</div>

        <div class="buttons">
            <button onclick="decrease()">−</button>
            <button onclick="reset()">Reset</button>
            <button onclick="increase()">+</button>
        </div>

        <p id="message">Start counting!</p>

    </div>

    <script src="mln.js"></script>

</body>
</html>
